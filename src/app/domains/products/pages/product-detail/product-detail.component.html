@let productDetail = product();

@if (productDetail) {
  @let coverUrl = cover();
  <div class="w-full flex flex-col md:flex-row md:space-x-10 pl-5 pr-60">
    <div class="flex flex-col w-full md:w-1/3">
      <div class="w-full rounded border border-gray-200">
        <div class="relative h-96 max-[600px]:h-[100px]">
          <img
            [fill]="true"
            alt="ecommerce"
            class="w-full object-cover object-center"
            [ngSrc]="coverUrl"
          />
        </div>
      </div>
      <div class="flex items-center justify-center mt-1">
        <div class="grid grid-cols-3 gap-1">
          @for (img of productDetail.images; track img) {
            <img
              alt="ecommerce"
              class="object-cover object-center rounded border-2 border-gray-200"
              width="80"
              height="80"
              [ngSrc]="img"
              (click)="changeCover(img)"
              [class.border-red-400]="img === coverUrl"
              tabindex="0"
              role="button"
            />
          }
        </div>
      </div>
    </div>
    <div class="mt-5 w-full">
      <h2 class="text-sm title-font text-gray-500 tracking-widest">
        {{ productDetail.category | uppercase }}
      </h2>
      <h1 class="text-gray-900 text-3xl title-font font-medium mb-1">
        {{ productDetail.title }}
      </h1>
      <p class="leading-relaxed">
        {{ productDetail.description }}
      </p>
      <p class="title-font font-medium text-2xl text-gray-900 mt-5">
        {{ productDetail.price | currency: "$" : "symbol" : "1.0" }}
      </p>
      <button
        (click)="addToCart()"
        class="flex text-white bg-red-500 border-0 py-2 px-6 focus:outline-none hover:bg-red-600 rounded justify-self-end"
      >
        Add To Cart
      </button>
    </div>
  </div>
}
